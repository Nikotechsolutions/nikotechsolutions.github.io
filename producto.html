<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto | Nikotechsolutions</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .detail-wrapper {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        @media (max-width: 768px) {
            .detail-wrapper {
                grid-template-columns: 1fr;
                margin: 20px auto;
            }
        }

        .detail-image-container {
            position: relative;
            background: var(--bg-card, #0c162c);
            border: 1px solid var(--border-glow, rgba(0, 242, 254, 0.25));
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .detail-image-container img {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 12px;
        }

        .detail-info {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .detail-badge {
            align-self: flex-start;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid var(--accent-green, #10b981);
            color: var(--accent-green, #10b981);
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            text-transform: uppercase;
        }

        .detail-title {
            font-size: 2rem;
            margin: 0;
            color: #fff;
        }

        .detail-rating {
            color: #f59e0b;
            font-size: 1.2rem;
        }

        .detail-price-box {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent-cyan, #00f2fe);
        }

        .detail-old-price {
            text-decoration: line-through;
            color: var(--text-muted, #94a3b8);
            font-size: 1.2rem;
        }

        .detail-description {
            line-height: 1.6;
            color: var(--text-muted, #94a3b8);
            font-size: 0.95rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 0;
        }

        .detail-actions {
            display: flex;
            gap: 16px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btn-add-large {
            background: linear-gradient(90deg, var(--accent-cyan, #00f2fe), #00a8ff);
            color: #000;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-add-large:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
        }

        .btn-back {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px 24px;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .btn-back:hover {
            border-color: var(--accent-cyan, #00f2fe);
            color: var(--accent-cyan, #00f2fe);
        }
    </style>
</head>
<body>

    <!-- HEADER IDÉNTICO A INDEX Y CATÁLOGO -->
    <header>
        <div class="container nav-container">
            <a href="#" class="brand-logo">
                    <i class="fa-solid fa-bolt" style="color: var(--accent-cyan);"></i>
                     <span style="color: #fff;">Nikotech<span style="color: var(--accent-cyan); text-shadow: 0 0 12px rgba(0, 242, 254, 0.6);">solutions</span></span>
                </a>

            <nav>
                <ul class="nav-links" id="navLinks">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="catalogo.html">Catálogo</a></li>
                    <li><a href="ofertas.html">Ofertas</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>

            <div class="header-actions">
                <div class="search-box" id="searchBox">
                    <i class="fa-solid fa-magnifying-glass" onclick="toggleSearch()"></i>
                    <input type="text" id="searchInput" placeholder="Buscar..." onkeyup="filterProducts()">
                </div>
                
                <button class="cart-btn" onclick="toggleCart()">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </button>

                <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- DETALLE DE PRODUCTO -->
    <main>
        <div id="product-content">
            <!-- Cargado vía JS -->
        </div>
    </main>

    <!-- MODAL CARRITO -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-header">
            <h3>Tu Carrito</h3>
            <button class="close-cart" onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <button class="btn-whatsapp" onclick="checkoutWhatsApp()">
                <i class="fa-brands fa-whatsapp"></i> Comprar por WhatsApp
            </button>
        </div>
    </div>

    <script src="products.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = parseInt(urlParams.get('id'));
            const container = document.getElementById('product-content');

            const product = products.find(p => p.id === productId);

            if (product) {
                document.title = `${product.title} | Nikotechsolutions`;
                const oldPriceHtml = product.oldPrice 
                    ? `<span class="detail-old-price">$${product.oldPrice.toFixed(2)}</span>` 
                    : '';

                container.innerHTML = `
                    <div class="detail-wrapper">
                        <div class="detail-image-container">
                            <img src="${product.image}" alt="${product.title}">
                        </div>
                        <div class="detail-info">
                            ${product.badge ? `<span class="detail-badge">${product.badge}</span>` : ''}
                            <h1 class="detail-title">${product.title}</h1>
                            <div class="detail-rating">
                                ${'★'.repeat(product.rating)}${'☆'.repeat(5 - product.rating)}
                            </div>
                            <div class="detail-price-box">
                                ${oldPriceHtml}
                                <span>$${product.price.toFixed(2)}</span>
                            </div>
                            <p class="detail-description">${product.description || 'Sin descripción disponible.'}</p>
                            <div class="detail-actions">
                                <button class="btn-add-large" onclick="addToCart(${product.id})">
                                    <i class="fa-solid fa-cart-plus"></i> Agregar al Carrito
                                </button>
                                <a href="catalogo.html" class="btn-back">
                                    <i class="fa-solid fa-arrow-left"></i> Volver al Catálogo
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div style="text-align: center; padding: 80px 20px;">
                        <h2>Producto no encontrado</h2>
                        <p style="color: var(--text-muted); margin: 15px 0 25px 0;">El producto buscado no existe.</p>
                        <a href="catalogo.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Volver al Catálogo</a>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
